<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 40 440 120"
     width="100%"
     height="100%">
  <defs>
    <linearGradient id="techBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
  </defs>

  <!-- GM Technológiai Műszaki Ikon -->
  <g transform="translate(45, 45)">
    <!-- Külső szögletes védőkeret -->
    <path d="M 10 30 L 10 10 L 30 10" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
    <path d="M 80 10 L 100 10 L 100 30" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
    <path d="M 100 80 L 100 100 L 80 100" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
    <path d="M 30 100 L 10 100 L 10 80" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />

    <!-- G -->
    <path d="M 48 35 L 30 35 C 22 35 20 42 20 55 C 20 68 22 75 30 75 L 48 75 L 48 55 L 38 55"
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- M -->
    <path d="M 60 75 L 60 35 L 72 55 L 84 35 L 84 75"
          fill="none" stroke="url(#techBlue)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Node -->
    <circle cx="38" cy="55" r="3" fill="#00E5FF" />
  </g>

  <!-- GM TECH -->
  <text x="175" y="105"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="46"
        font-weight="900"
        fill="#FFFFFF"
        letter-spacing="2">GM</text>

  <text x="255" y="105"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="46"
        font-weight="900"
        fill="url(#techBlue)"
        letter-spacing="2">TECH</text>

  <!-- Alcím -->
  <text x="177" y="132"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="12"
        font-weight="600"
        fill="#8A99AD"
        letter-spacing="3.5">TESTING &amp; IT SOLUTIONS</text>

  <!-- Alsó sáv -->
  <line x1="177" y1="142" x2="430" y2="142" stroke="#232E3F" stroke-width="2" />
  <line x1="177" y1="142" x2="240" y2="142" stroke="#00E5FF" stroke-width="2" />
</svg>